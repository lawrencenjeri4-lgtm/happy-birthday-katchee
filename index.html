<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sheey ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><!-- Welcome Screen -->
<section id="welcome" class="screen">
    <h1>Happy Birthday Sheey ❤️</h1>
    <p>A special surprise is waiting for you...</p>

    <button id="startBtn">
        Open Your Surprise 🎁
    </button>
</section>

<!-- Lights Screen -->
<section id="lightsScreen" class="screen hidden">
    <h1>Ready Sheey? ✨</h1>
    <p>Let's light up your special day!</p>

    <button id="lightsBtn">
        Turn On The Lights 💡
    </button>

    <button id="messageBtn" class="hidden">
        Read Lawrence's Message ❤️
    </button>
</section>

<!-- Message Screen -->
<section id="messageScreen" class="screen hidden">

    <h1>For My Sheey ❤️</h1>

    <div id="typedMessage"></div>

    <button id="continueBtn" class="hidden">
        Continue ➡️
    </button>

</section>

<!-- Slideshow Screen -->

<section id="slideshowScreen" class="screen hidden">

    <h1>Happy Birthday Sheey ❤️</h1>

<img
    id="slideImage"
    src="assets/photos/photo 1.jpg"
    alt="Sheey"
>

    <audio id="birthdaySong" controls>
        <source
    src="assets/photos/music/happy-birthday.mp3"
    type="audio/mpeg">
    </audio>

</section>

<!-- Balloons -->
<div id="balloons" class="hidden">
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
</div>

<script src="script.js"></script>

</body>
</html>
