<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Katchee ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Welcome Screen -->
    <section id="welcome" class="screen">
        <h1>Happy Birthday Katchee ❤️</h1>

        <p>
            A special surprise is waiting for you...
        </p>

        <button id="startBtn">
            Open Your Surprise 🎁
        </button>
    </section>

    <!-- Lights Screen -->
    <section id="lightsScreen" class="screen hidden">
        <h1>Ready Katchee? ✨</h1>

        <p>
            Let's light up your special day!
        </p>

        <button id="lightsBtn">
            Turn On The Lights 💡
        </button>
    </section>

    <!-- Balloons -->
    <div id="balloons" class="hidden">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
